<!--
Popup HTML for Chrome Extension
Provides quick access to filtering controls and page results
-->
<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 420px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        .popup-header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .popup-header h1 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .popup-header p {
            font-size: 12px;
            opacity: 0.8;
        }

        .popup-content {
            padding: 15px;
            background: white;
            max-height: 560px;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-group label:hover {
            background: #f0f0f0;
        }

        .control-group input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .status {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
            color: #666;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
        }

        #results {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #e1e7ef;
            border-radius: 6px;
            background: #f9fbfd;
        }

        .results-title {
            margin: 10px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #3498db;
            color: #2c3e50;
            font-size: 13px;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .stat-box {
            padding: 9px;
            border: 1px solid #e1e7ef;
            border-radius: 5px;
            background: white;
            text-align: center;
        }

        .stat-box.academic {
            border-top: 4px solid #28a745;
        }

        .stat-box.non-academic {
            border-top: 4px solid #dc3545;
        }

        .stat-label {
            color: #667085;
            font-size: 10px;
        }

        .stat-value {
            margin-top: 4px;
            color: #1f2937;
            font-size: 17px;
            font-weight: bold;
        }

        .stat-percent {
            color: #98a2b3;
            font-size: 10px;
        }

        #messagesList {
            max-height: 220px;
            overflow-y: auto;
        }

        .message-item {
            margin-bottom: 8px;
            padding: 8px;
            border-left: 4px solid #98a2b3;
            border-radius: 5px;
            background: white;
        }

        .message-item.academic {
            border-left-color: #28a745;
            background: #f2fbf5;
        }

        .message-item.non-academic {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .badge-inline {
            display: inline-block;
            margin-bottom: 5px;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
        }

        .badge-inline.academic {
            background: #d4edda;
            color: #155724;
        }

        .badge-inline.non-academic {
            background: #f8d7da;
            color: #721c24;
        }

        .message-text {
            color: #475467;
            font-size: 11px;
            line-height: 1.4;
            word-break: break-word;
        }

        .more-messages {
            padding: 8px;
            color: #667085;
            font-size: 11px;
            font-style: italic;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #2980b9;
        }

        .popup-footer {
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #666;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="popup-header">
        <h1>🎓 MDB Filter</h1>
        <p>Virtual University</p>
    </div>

    <div class="popup-content">
        <div class="status" id="status">Inactive</div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="keywordFilter" checked>
                <span>Keyword Filter</span>
            </label>
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="aiFilter" checked>
                <span>AI Filter</span>
            </label>
        </div>

        <button id="classifyBtn">Classify Messages</button>
        <button id="settingsBtn">Settings</button>

        <div id="results">
            <div class="results-title">Analysis Results</div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>

                <div class="stat-box academic">
                    <div class="stat-label">Academic</div>
                    <div class="stat-value" id="academicCount">0</div>
                    <div class="stat-percent"><span id="academicPercent">0</span>%</div>
                </div>

                <div class="stat-box non-academic">
                    <div class="stat-label">Non-Academic</div>
                    <div class="stat-value" id="nonAcademicCount">0</div>
                    <div class="stat-percent"><span id="nonAcademicPercent">0</span>%</div>
                </div>
            </div>

            <div class="results-title">Found Text</div>
            <div id="messagesList"></div>
        </div>
    </div>

    <div class="popup-footer">
        <p>Supervisor: Saima Jamil</p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
